<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Advice API</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #ff4d6d, #ff8fab, #ffc2d1);
    color: white;
    text-align: center;
    padding-top: 60px;
}

.box {
    background: rgba(255,255,255,0.2);
    padding: 20px;
    border-radius: 20px;
    max-width: 500px;
    margin: auto;
    backdrop-filter: blur(10px);
}

button {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 10px;
    font-size: 16px;
}

#btn {
    background: #fff;
    color: #ff4d6d;
    font-weight: bold;
}

.save {
    background: #ffd6e0;
}

.advice {
    margin: 20px 0;
    font-size: 20px;
    min-height: 60px;
}

ul {
    list-style: none;
    padding: 0;
}
li {
    background: rgba(255,255,255,0.3);
    margin: 5px;
    padding: 8px;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="box">

<h1> Совет дня</h1>

<div class="advice" id="advice">Нажми кнопку </div>

<button id="btn">Получить совет</button>
<button class="save" onclick="saveAdvice()"> Сохранить</button>

<h3>⭐ Сохранённые советы</h3>
<ul id="list"></ul>

</div>

<script>

let currentAdvice = "";


document.getElementById("btn").onclick = async function () {
    let res = await fetch("https://api.adviceslip.com/advice");
    let data = await res.json();

    currentAdvice = data.slip.advice;

    document.getElementById("advice").innerText = currentAdvice;
};


function saveAdvice() {
    if (!currentAdvice) return;

    let saved = JSON.parse(localStorage.getItem("advices") || "[]");

    saved.push(currentAdvice);

    localStorage.setItem("advices", JSON.stringify(saved));

    render();
}


function render() {
    let list = document.getElementById("list");
    list.innerHTML = "";

    let saved = JSON.parse(localStorage.getItem("advices") || "[]");

    saved.forEach(a => {
        let li = document.createElement("li");
        li.innerText = a;
        list.appendChild(li);
    });
}


render();

</script>

</body>
</html>
